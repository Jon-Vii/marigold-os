[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
app-core = { path = "../app-core" }
display = { path = "../display" }
proto = { path = "../proto" }

[dev-dependencies]
heapless = "0.9.0"
# Encodes the JPEGs the firmware image tests probe and decode.
jpeg-encoder = "0.6.1"
# The same FAT code as the firmware (fw/Cargo.toml). The test disk's
# one-sector clusters never form a multi-block batch; vendor/embedded-sdmmc's
# own tests cover batching.
embedded-sdmmc = { git = "https://github.com/Jon-Vii/embedded-sdmmc-rs.git", rev = "329b3a53a55fb527f62a7813557b420817e831d8", default-features = false, features = ["contiguous-file-read"] }
