# Open a book from the card, step into its chapter overview, move two
# chapters on, and jump there.

[[steps]]
button = "Back"

[[steps]]
library = "Scanned"
count = 3

[[steps]]
button = "Confirm"

[[steps]]
library = "Loaded"
book_id = 2
pages = 30
chapters = 4

[[steps]]
button = "Confirm"

[[steps]]
button = "Next"

[[steps]]
button = "Next"

[[steps]]
button = "Confirm"

[expect]
view = "Reading"
book_id = 2
chapter = 2
selection = 2
