[package]
name = "proto"
version = "0.1.0"
edition = "2021"

[dependencies]
# Byte scratch viewed as u32 accumulators and i16 error rows, without unsafe.
bytemuck = { version = "1.25.0", default-features = false }
heapless = "0.9.0"
miniz_oxide = { version = "0.9.1", default-features = false }
# SHA-256 for OTA image validation (no_std, no heap). asm is off so it builds
# for both the riscv32 target and host tests.
sha2 = { version = "0.10.8", default-features = false }
# otadata seq CRC. Same crate + algorithm esp-bootloader-esp-idf uses, so our
# CRC is identical to the ROM's crc32_le(u32::MAX, ..) by construction.
crc = "3.2.1"

[dev-dependencies]
# Tests deflate their own fixtures; firmware builds never see this feature.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# Reference encoder and decoder for the image decoder's tests.
png = "0.17.16"
