name: Deploy web emulator to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/verify_web_flasher.sh"
      - "tools/web-emulator/**"
      - "app-core/**"
      - "display/**"
      - "ui/**"
      - "proto/**"
      - "fixtures/scenarios/**"
      - "fixtures/golden/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose firmware should be published"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Install Rust (stable, wasm target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Build wasm emulator
        working-directory: tools/web-emulator
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Check emulator golden frames
        run: cargo run --manifest-path tools/emulator/Cargo.toml --target x86_64-unknown-linux-gnu --no-default-features -- --scenario fixtures/scenarios --check fixtures/golden
      - name: Check X3 emulator golden frames
        run: cargo run --manifest-path tools/emulator/Cargo.toml --target x86_64-unknown-linux-gnu --no-default-features --features device-x3 -- --scenario fixtures/scenarios --check fixtures/golden
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
        run: |
          mkdir -p _site
          cp -R web/. _site/
          cp tools/web-emulator/target/wasm32-unknown-unknown/release/x4_web_emulator.wasm _site/
          if [ "$RELEASE_TAG" = latest ]; then
            RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          export RELEASE_TAG
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern firmware-x4.bin --pattern firmware-x3.bin \
            --pattern SHA256SUMS --dir _site
          (cd _site && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import re

          site = pathlib.Path("_site")
          version = os.environ["RELEASE_TAG"]
          index = site / "index.html"
          page, count = re.subn(
              r'(<span class="k">Version</span><b>)[^<]*(</b>)',
              lambda match: match[1] + html.escape(version) + match[2],
              index.read_text(),
          )
          if count != 1:
              raise SystemExit("Expected exactly one firmware version label")
          index.write_text(page)
          for device in ("x4", "x3"):
              path = site / f"manifest-{device}.json"
              manifest = json.loads(path.read_text())
              manifest["version"] = version
              path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          tools/verify_web_flasher.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
