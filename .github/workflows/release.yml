name: Release firmware images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, firmware target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add riscv32imc-unknown-none-elf --toolchain stable

      - name: Install espflash
        run: CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu cargo install espflash --locked

      - name: Build X4 release images
        run: tools/build-release.sh x4

      - name: Build X3 release images
        run: tools/build-release.sh x3

      - name: Assemble public release assets
        run: |
          mkdir -p target/public-release
          cp target/release-images/firmware.bin target/public-release/firmware-x4.bin
          cp target/release-images/firmware-x3.bin target/public-release/firmware-x3.bin

      - name: Verify release images and write checksums
        run: |
          python3 tools/verify_release_images.py target/public-release
          cd target/public-release
          sha256sum firmware-x4.bin firmware-x3.bin > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/public-release/firmware-x4.bin \
            target/public-release/firmware-x3.bin \
            target/public-release/SHA256SUMS \
            --verify-tag --latest \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Publish release firmware to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f release_tag="${GITHUB_REF_NAME}"
